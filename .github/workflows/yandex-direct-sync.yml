name: Yandex Direct Sync

# Runs every day at 01:00 UTC (04:00 Moscow).
# Fetches yesterday's campaign data from Yandex Direct and writes it to Supabase.

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:   # allow manual trigger from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run Yandex Direct sync
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_LOGIN: ${{ secrets.YANDEX_DIRECT_LOGIN }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:   ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/yandex_direct_sync.py
